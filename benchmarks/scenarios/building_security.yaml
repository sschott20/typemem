queries:
  - time: 500
    query: "What is the current status of each zone?"
    ground_truth: ["secure", "entrance", "clear", "locked", "72F", "operational"]
    token_budget: 400

  - time: 1100
    query: "Have there been any visitors today?"
    ground_truth: ["visitor", "signed in", "East Wing", "conference room"]
    token_budget: 300

  - time: 1600
    query: "Has anything unusual happened?"
    ground_truth: ["restricted lab", "unlocked", "door"]
    token_budget: 300

  - time: 2500
    query: "What is happening with the Server Room temperature?"
    ground_truth: ["temperature", "increasing", "75F", "above", "baseline"]
    token_budget: 300

  - time: 3200
    query: "Have there been any security incidents?"
    ground_truth: ["unfamiliar person", "restricted", "no badge", "emergency exit", "unlocked"]
    token_budget: 400

  - time: 3700
    query: "What is happening in the Server Room right now?"
    ground_truth: ["maintenance", "technician", "cooling", "temperature", "underperforming"]
    token_budget: 300

  - time: 4600
    query: "Summarize all activity in the West Wing today"
    ground_truth: ["restricted lab", "unlocked", "cleaning crew", "visitor", "meeting", "motion"]
    token_budget: 400

  - time: 5200
    query: "What are the most critical concerns right now?"
    ground_truth: ["temperature", "server room", "81F", "cooling", "restricted lab", "unlocked"]
    token_budget: 400

  - time: 6100
    query: "How has the Server Room situation evolved over the full shift?"
    ground_truth: ["72F", "temperature", "increasing", "maintenance", "compressor", "fan", "repair", "recovery"]
    token_budget: 400

  - time: 6400
    query: "What lessons and patterns should be passed to the next shift?"
    ground_truth: ["server room", "cooling", "temperature", "restricted lab", "unlocked", "recurring"]
    token_budget: 400
