name: "Building security patrol - 2 hours"
description: "Robot patrols a 4-zone building (Lobby, East Wing, West Wing, Server Room) over 2 hours. Includes routine patrols, visitor activity, anomalies, and an escalating temperature issue in the Server Room."
duration_minutes: 120

